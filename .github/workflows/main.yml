name: Pipeline de Testes PetShop

# Quando o robô deve trabalhar?
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest # O GitHub vai usar um Linux zerado

    steps:
    # 1. Baixa o seu código para a máquina do GitHub
    - uses: actions/checkout@v4

    # 2. Instala o .NET (Ajustado para o seu net10.0)
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' 

    # 3. Restaura as bibliotecas (Moq, xUnit, EF Core)
    - name: Restore dependencies
      run: dotnet restore

    # 4. Compila o projeto para ver se não tem erro de sintaxe
    - name: Build
      run: dotnet build --no-restore

     # 5. Roda os testes com o coletor nativo do .NET
    - name: Test with Coverage
      run: dotnet test --no-build --verbosity normal --collect:"XPlat Code Coverage"

    # 6. Gera o relatório (Ajustei o caminho do report para onde o .NET salva por padrão)
    - name: ReportGenerator
      uses: danielpalme/ReportGenerator-GitHub-Action@5.2.4
      with:
        reports: '**/TestResults/**/coverage.cobertura.xml' # O .NET cria uma pasta TestResults automática
        targetdir: 'coveragereport'
        reporttypes: 'HtmlInline;Cobertura'

    # 7. Sobe o relatório para você baixar
    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: relatorio-cobertura
        path: coveragereport